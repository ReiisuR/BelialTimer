name: Publicar pacote Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas de build
        run: python -m pip install -r requirements-build.txt

      - name: Criar executável e ZIP
        shell: powershell
        run: .\build_release.ps1

      - name: Publicar release de teste
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: gh release create "$env:RELEASE_TAG" "dist/BelialTimer-windows-x64.zip" --title "Belial Timer $env:RELEASE_TAG" --generate-notes --prerelease
